# BdayHero
#
#   docker compose up -d                      # app only (external Postgres via DATABASE_URL)
#   docker compose --profile db up -d         # app + bundled Postgres
#
# Secrets: values are taken from the *shell environment* that runs `docker compose`
# (e.g. injected by `infisical run -- docker compose up -d`, see docs/infisical.md).
# They are passed through 1:1 with `environment:` and are NOT re-interpolated, so
# secrets containing `$` are safe. If you prefer a .env file, use
#   env_file: [{ path: .env, format: raw }]   (Compose >= 2.30, disables interpolation)
# instead of the environment block - never paste secrets literally into this file
# without escaping `$` as `$$`.

services:
  app:
    image: kidilias/bdayhero:latest
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      ORIGIN: ${ORIGIN:?ORIGIN is required (public URL, e.g. https://bday.example.com)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${ORIGIN}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:-postgres://bdayhero:${POSTGRES_PASSWORD:-bdayhero}@db:5432/bdayhero}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      PROJ_TITLE: ${PROJ_TITLE:-KidsBday}
      PUBLIC_HERO_ONLY: ${PUBLIC_HERO_ONLY:-false}
      PUBLIC_MAX_COMPANIONS_PER_GUEST: ${PUBLIC_MAX_COMPANIONS_PER_GUEST:-1}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-512K}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdayhero
      POSTGRES_USER: bdayhero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdayhero}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bdayhero -d bdayhero']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
